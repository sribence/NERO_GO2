version: '3.3'

services:
  # Hardware Bridge Layer
  webrtc_bridge:
    build:
      context: ./src/go2-hardware-bridge/webrtc_bridge
    image: nero_go2/webrtc_bridge:latest
    network_mode: host
    environment:
      - UNITREE_ROBOT_IP=192.168.123.161
      - UNITREE_AES_128_KEY=${UNITREE_AES_128_KEY:-7c5a74e640766444cc26b19990968133}
    restart: unless-stopped


  # GUI & Visualization Layer
  web_dashboard:
    build:
      context: ./src/go2-gui-visualization/web_dashboard
    image: nero_go2/web_dashboard:latest
    network_mode: host
    environment:
      - DDS_NETWORK_INTERFACE=eth0
      - PORT=8080
    volumes:
      - ./src/go2-gui-visualization/web_dashboard:/app
    restart: unless-stopped

  go2_console:
    build:
      context: ./src/go2-gui-visualization/go2-console
    image: nero_go2_go2_console:latest
    network_mode: host
    environment:
      - CONSOLE_BACKEND=live
      - CORE_URL=http://127.0.0.1:9101
      - MOTION_URL=http://127.0.0.1:9102
      - AUDIO_URL=http://127.0.0.1:9107
    volumes:
      - ./src/go2-gui-visualization/go2-console:/app
    restart: unless-stopped

  # Audio Service
  mc_audio:
    build:
      context: ./src/go2-brain-logic/mission_control
      dockerfile: audio/Dockerfile
    image: nero_go2_mc_audio:latest
    network_mode: host
    devices:
      - "/dev/snd:/dev/snd"
    restart: unless-stopped



  # Brain & Autonomy Layer
  mission_control:
    build:
      context: ./src/go2-brain-logic/mission_control
    image: nero_go2/web_dashboard:latest
    network_mode: host
    environment:
      - DDS_NETWORK_INTERFACE=eth0
      - PORT=8000
    volumes:
      - ./src/go2-gui-visualization/web_dashboard:/app
    restart: unless-stopped
