# Broker config for the orchestration pillar's MQTT bridge.
#
# Anonymous access is OFF: with it on, anyone who could reach 1883 could
# submit tasks that move the robot and (via call_api) make it issue
# arbitrary HTTP requests -- see AUDIT-2026-09-10.md P0-7/P0-8.
#
# Create the password file once:
#   docker run --rm -v "$PWD:/w" eclipse-mosquitto:2 #     mosquitto_passwd -c -b /w/mosquitto_passwd missioncontrol <PASSWORD>
listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto_passwd
persistence false
